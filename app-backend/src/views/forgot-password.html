<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forgot Password</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #060818;
      --border: rgba(255,255,255,0.09);
      --border-focus: rgba(108,99,255,0.55);
      --primary: #6c63ff;
      --primary-light: #9d97ff;
      --text: #f1f5f9;
      --text-dim: #94a3b8;
      --muted: #475569;
      --danger: #f87171;
      --danger-bg: rgba(248,113,113,0.08);
      --danger-border: rgba(248,113,113,0.25);
      --success: #34d399;
      --success-bg: rgba(52,211,153,0.08);
      --success-border: rgba(52,211,153,0.25);
      --radius: 12px;
    }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      position: relative;
      overflow: hidden;
    }
    body::before {
      content: '';
      position: fixed;
      width: 500px; height: 500px;
      background: radial-gradient(circle at center, rgba(108,99,255,0.11) 0%, transparent 65%);
      top: -120px; left: -80px;
      pointer-events: none;
    }
    body::after {
      content: '';
      position: fixed;
      width: 400px; height: 400px;
      background: radial-gradient(circle at center, rgba(6,182,212,0.07) 0%, transparent 65%);
      bottom: -100px; right: -80px;
      pointer-events: none;
    }

    .card {
      background: rgba(255,255,255,0.03);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 400px;
      position: relative;
      box-shadow: 0 20px 60px rgba(0,0,0,0.4), 0 0 0 1px rgba(255,255,255,0.04) inset;
    }
    .card::before {
      content: '';
      position: absolute;
      top: 0; left: 15%; right: 15%;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(108,99,255,0.5), transparent);
    }

    .header { text-align: center; margin-bottom: 1.75rem; }
    .brand-icon {
      width: 48px; height: 48px;
      background: linear-gradient(135deg, rgba(108,99,255,0.18), rgba(6,182,212,0.1));
      border: 1px solid rgba(108,99,255,0.22);
      border-radius: 13px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 0.9rem;
      color: var(--primary-light);
    }
    .brand-icon svg { width: 22px; height: 22px; stroke-width: 1.75; }
    .header h1 { font-size: 1.3rem; font-weight: 700; letter-spacing: -0.025em; }
    .header p { font-size: 0.84rem; color: var(--text-dim); margin-top: 0.3rem; line-height: 1.5; }

    .alert {
      display: flex; align-items: flex-start; gap: 0.5rem;
      padding: 0.65rem 0.85rem; border-radius: var(--radius);
      font-size: 0.82rem; margin-bottom: 1.1rem;
    }
    .alert svg { width: 14px; height: 14px; flex-shrink: 0; margin-top: 1px; stroke-width: 2.5; }
    .alert-error   { background: var(--danger-bg);  border: 1px solid var(--danger-border);  color: var(--danger);  }
    .alert-success { background: var(--success-bg); border: 1px solid var(--success-border); color: var(--success); }

    .field { margin-bottom: 1.1rem; }
    .field label { display: block; font-size: 0.78rem; font-weight: 600; color: var(--text-dim); margin-bottom: 0.38rem; }
    .input-wrap { position: relative; display: flex; align-items: center; }
    .input-icon { position: absolute; left: 0.72rem; color: var(--muted); display: flex; align-items: center; pointer-events: none; }
    .input-icon svg { width: 15px; height: 15px; stroke-width: 2; }
    .input-wrap input {
      width: 100%;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.65rem 0.85rem 0.65rem 2.35rem;
      border-radius: var(--radius);
      font-size: 0.875rem;
      outline: none;
      transition: all 0.18s ease;
      font-family: inherit;
    }
    .input-wrap input::placeholder { color: var(--muted); }
    .input-wrap input:focus { border-color: var(--border-focus); background: rgba(108,99,255,0.04); box-shadow: 0 0 0 3px rgba(108,99,255,0.1); }

    .btn-submit {
      width: 100%;
      background: linear-gradient(135deg, #6c63ff, #8b5cf6);
      color: #fff; border: none;
      padding: 0.7rem; border-radius: var(--radius);
      font-size: 0.9rem; font-weight: 600;
      cursor: pointer; transition: all 0.18s ease;
      margin-top: 0.1rem;
      display: flex; align-items: center; justify-content: center; gap: 0.45rem;
      box-shadow: 0 4px 14px rgba(108,99,255,0.35);
      font-family: inherit;
    }
    .btn-submit svg { width: 16px; height: 16px; stroke-width: 2.5; }
    .btn-submit:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(108,99,255,0.45); }
    .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; }

    .footer { text-align: center; margin-top: 1.25rem; font-size: 0.8rem; }
    .back-link {
      display: inline-flex; align-items: center; gap: 0.35rem;
      color: var(--text-dim); text-decoration: none; transition: color 0.18s; font-weight: 500;
    }
    .back-link svg { width: 13px; height: 13px; stroke-width: 2.5; }
    .back-link:hover { color: var(--primary-light); }

    .spinner { width: 14px; height: 14px; border: 2px solid rgba(255,255,255,0.3); border-top-color: #fff; border-radius: 50%; animation: spin 0.6s linear infinite; flex-shrink: 0; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="card">
    <div class="header">
      <div class="brand-icon"><i data-lucide="key-round"></i></div>
      <h1>Forgot password?</h1>
      <p>No worries — enter your email and we'll send you a reset link.</p>
    </div>

    <div class="alert alert-error"   id="error-box"   style="display:none"><i data-lucide="alert-circle"></i><span id="error-text"></span></div>
    <div class="alert alert-success" id="success-box" style="display:none"><i data-lucide="mail-check"></i><span id="success-text"></span></div>

    <form id="forgot-form" novalidate>
      <div class="field">
        <label for="email">Email address</label>
        <div class="input-wrap">
          <span class="input-icon"><i data-lucide="mail"></i></span>
          <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email" required />
        </div>
      </div>
      <button type="submit" class="btn-submit" id="submit-btn">
        <i data-lucide="send"></i>
        Send Reset Link
      </button>
    </form>

    <div class="footer">
      <a href="/oauth/login" class="back-link">
        <i data-lucide="arrow-left"></i>
        Back to Sign in
      </a>
    </div>
  </div>

  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script>
    lucide.createIcons();

    document.getElementById('forgot-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn      = document.getElementById('submit-btn');
      const errBox   = document.getElementById('error-box');
      const succBox  = document.getElementById('success-box');
      const email    = document.getElementById('email').value.trim();

      btn.disabled  = true;
      btn.innerHTML = '<div class="spinner"></div> Sending…';
      errBox.style.display  = 'none';
      succBox.style.display = 'none';

      try {
        const res  = await fetch('/api/auth/forgot-password', { method: 'POST', headers: { 'Content-Type': 'application/json', Accept: 'application/json' }, body: JSON.stringify({ email }) });
        const data = await res.json();
        if (res.ok) {
          document.getElementById('success-text').textContent = data.message || 'Reset link sent! Check your email.';
          succBox.style.display = 'flex';
          document.getElementById('forgot-form').style.display = 'none';
        } else {
          document.getElementById('error-text').textContent = data.error || 'Something went wrong. Please try again.';
          errBox.style.display = 'flex';
          btn.disabled  = false;
          btn.innerHTML = '<i data-lucide="send"></i> Send Reset Link';
          lucide.createIcons();
        }
      } catch {
        document.getElementById('error-text').textContent = 'Network error. Please try again.';
        errBox.style.display = 'flex';
        btn.disabled  = false;
        btn.innerHTML = '<i data-lucide="send"></i> Send Reset Link';
        lucide.createIcons();
      }
    });
  </script>
</body>
</html>
