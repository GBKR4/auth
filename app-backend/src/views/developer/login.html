<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Developer Login — Auth Provider</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #060818;
      --border: rgba(255,255,255,0.09);
      --border-focus: rgba(108,99,255,0.55);
      --primary: #6c63ff;
      --primary-light: #9d97ff;
      --text: #f1f5f9;
      --text-dim: #94a3b8;
      --muted: #475569;
      --danger: #f87171;
      --danger-bg: rgba(248,113,113,0.08);
      --danger-border: rgba(248,113,113,0.25);
      --radius: 12px;
    }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      position: relative;
      overflow: hidden;
    }
    body::before {
      content: '';
      position: fixed;
      width: 550px; height: 550px;
      background: radial-gradient(circle at center, rgba(108,99,255,0.12) 0%, transparent 65%);
      top: -150px; left: -100px;
      pointer-events: none;
    }
    body::after {
      content: '';
      position: fixed;
      width: 400px; height: 400px;
      background: radial-gradient(circle at center, rgba(6,182,212,0.07) 0%, transparent 65%);
      bottom: -100px; right: -80px;
      pointer-events: none;
    }

    .card {
      background: rgba(255,255,255,0.03);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 400px;
      position: relative;
      box-shadow: 0 20px 60px rgba(0,0,0,0.4), 0 0 0 1px rgba(255,255,255,0.04) inset;
    }
    .card::before {
      content: '';
      position: absolute;
      top: 0; left: 15%; right: 15%;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(108,99,255,0.5), transparent);
    }

    .header { text-align: center; margin-bottom: 1.75rem; }
    .brand-icon {
      width: 48px; height: 48px;
      background: linear-gradient(135deg, rgba(108,99,255,0.18), rgba(139,92,246,0.12));
      border: 1px solid rgba(108,99,255,0.22);
      border-radius: 13px;
      display: inline-flex; align-items: center; justify-content: center;
      margin-bottom: 0.9rem;
      color: var(--primary-light);
    }
    .brand-icon svg { width: 22px; height: 22px; stroke-width: 1.75; }
    .header h1 { font-size: 1.3rem; font-weight: 700; letter-spacing: -0.025em; }
    .header p { font-size: 0.84rem; color: var(--text-dim); margin-top: 0.3rem; }

    .error-box {
      display: flex; align-items: flex-start; gap: 0.5rem;
      background: var(--danger-bg); border: 1px solid var(--danger-border);
      color: var(--danger); padding: 0.65rem 0.85rem;
      border-radius: var(--radius); font-size: 0.82rem; margin-bottom: 1.1rem;
    }
    .error-box svg { width: 14px; height: 14px; flex-shrink: 0; margin-top: 1px; stroke-width: 2.5; }

    .field { margin-bottom: 1rem; }
    .field label { display: block; font-size: 0.78rem; font-weight: 600; color: var(--text-dim); margin-bottom: 0.38rem; }
    .input-wrap { position: relative; display: flex; align-items: center; }
    .input-icon { position: absolute; left: 0.72rem; color: var(--muted); display: flex; align-items: center; pointer-events: none; }
    .input-icon svg { width: 15px; height: 15px; stroke-width: 2; }
    .input-wrap input {
      width: 100%;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.65rem 2.5rem;
      border-radius: var(--radius);
      font-size: 0.875rem; outline: none;
      transition: all 0.18s ease; font-family: inherit;
    }
    .input-wrap input::placeholder { color: var(--muted); }
    .input-wrap input:focus { border-color: var(--border-focus); background: rgba(108,99,255,0.04); box-shadow: 0 0 0 3px rgba(108,99,255,0.1); }
    .toggle-pw {
      position: absolute; right: 0.7rem;
      background: none; border: none; cursor: pointer;
      color: var(--muted); display: flex; align-items: center; padding: 0; transition: color 0.18s;
    }
    .toggle-pw:hover { color: var(--text-dim); }
    .toggle-pw svg { width: 14px; height: 14px; stroke-width: 2; }

    .btn {
      width: 100%;
      background: linear-gradient(135deg, #6c63ff, #8b5cf6);
      color: #fff; border: none;
      padding: 0.7rem; border-radius: var(--radius);
      font-size: 0.9rem; font-weight: 600;
      cursor: pointer; transition: all 0.18s ease;
      margin-top: 0.25rem;
      display: flex; align-items: center; justify-content: center; gap: 0.45rem;
      box-shadow: 0 4px 14px rgba(108,99,255,0.35);
      font-family: inherit;
    }
    .btn svg { width: 16px; height: 16px; stroke-width: 2.5; }
    .btn:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(108,99,255,0.45); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .info { text-align: center; font-size: 0.8rem; color: var(--text-dim); margin-top: 1.1rem; }
    .info a { color: var(--primary-light); text-decoration: none; font-weight: 500; }
    .info a:hover { text-decoration: underline; }

    .spinner { width: 14px; height: 14px; border: 2px solid rgba(255,255,255,0.3); border-top-color: #fff; border-radius: 50%; animation: spin 0.6s linear infinite; flex-shrink: 0; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="card">
    <div class="header">
      <div class="brand-icon"><i data-lucide="code-2"></i></div>
      <h1>Developer Portal</h1>
      <p>Sign in to manage your OAuth apps</p>
    </div>

    <div class="error-box" id="error-box" style="display:none">
      <i data-lucide="alert-circle"></i>
      <span id="error-text"></span>
    </div>

    <form id="login-form" novalidate>
      <div class="field">
        <label for="email">Email address</label>
        <div class="input-wrap">
          <span class="input-icon"><i data-lucide="mail"></i></span>
          <input type="email" id="email" placeholder="you@example.com" autocomplete="email" required />
        </div>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <div class="input-wrap">
          <span class="input-icon"><i data-lucide="lock"></i></span>
          <input type="password" id="password" placeholder="Enter your password" autocomplete="current-password" required />
          <button type="button" class="toggle-pw" id="toggle-pw" aria-label="Toggle password">
            <i data-lucide="eye" id="eye-icon"></i>
          </button>
        </div>
      </div>
      <button type="submit" class="btn" id="submit-btn">
        <i data-lucide="log-in"></i>
        Sign in
      </button>
    </form>

    <div class="info">
      Don't have an account? <a href="/developer/register">Register here →</a>
    </div>
  </div>

  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script>
    lucide.createIcons();

    let pwVisible = false;
    document.getElementById('toggle-pw').addEventListener('click', () => {
      pwVisible = !pwVisible;
      document.getElementById('password').type = pwVisible ? 'text' : 'password';
      document.getElementById('eye-icon').setAttribute('data-lucide', pwVisible ? 'eye-off' : 'eye');
      lucide.createIcons();
    });

    fetch('/api/developer/clients', { credentials: 'include' })
      .then(r => { if (r.ok) window.location.href = '/developer'; })
      .catch(() => {});

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email    = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const btn      = document.getElementById('submit-btn');
      const errBox   = document.getElementById('error-box');

      if (!email || !password) { showError('Please enter your email and password.'); return; }

      btn.disabled  = true;
      btn.innerHTML = '<div class="spinner"></div> Signing in…';
      hideError();

      try {
        const res  = await fetch('/api/auth/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, credentials: 'include', body: JSON.stringify({ email, password }) });
        const data = await res.json();
        if (!res.ok) {
          showError(data.error || data.message || 'Login failed');
          btn.disabled  = false;
          btn.innerHTML = '<i data-lucide="log-in"></i> Sign in';
          lucide.createIcons(); return;
        }
        const role = data.user?.role;
        if (role !== 'developer' && role !== 'admin') {
          await fetch('/api/developer/register', { method: 'POST', credentials: 'include' });
        }
        window.location.href = '/developer';
      } catch {
        showError('Network error. Is the server running?');
        btn.disabled  = false;
        btn.innerHTML = '<i data-lucide="log-in"></i> Sign in';
        lucide.createIcons();
      }
    });

    function showError(msg) {
      document.getElementById('error-text').textContent = msg;
      document.getElementById('error-box').style.display = 'flex';
    }
    function hideError() { document.getElementById('error-box').style.display = 'none'; }
  </script>
</body>
</html>
