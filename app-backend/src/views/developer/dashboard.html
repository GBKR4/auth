<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Developer Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #060818;
      --surface: rgba(255,255,255,0.03);
      --nav: rgba(6,8,24,0.8);
      --border: rgba(255,255,255,0.08);
      --border-hover: rgba(255,255,255,0.14);
      --primary: #6c63ff;
      --primary-light: #9d97ff;
      --text: #f1f5f9;
      --text-dim: #94a3b8;
      --muted: #475569;
      --danger: #f87171;
      --danger-bg: rgba(248,113,113,0.08);
      --danger-border: rgba(248,113,113,0.22);
      --warning: #fbbf24;
      --radius: 12px;
    }

    body { font-family: 'Inter', system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
    body::before {
      content: '';
      position: fixed;
      width: 700px; height: 700px;
      background: radial-gradient(circle at center, rgba(108,99,255,0.08) 0%, transparent 65%);
      top: -250px; left: -200px;
      pointer-events: none;
    }

    /* NAV */
    nav {
      background: var(--nav);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border);
      padding: 0 1.75rem;
      display: flex; align-items: center; justify-content: space-between;
      height: 60px;
      position: sticky; top: 0; z-index: 50;
    }
    .nav-brand {
      display: flex; align-items: center; gap: 0.55rem;
      font-weight: 700; font-size: 0.95rem; color: var(--text);
      letter-spacing: -0.02em;
    }
    .nav-brand-icon {
      width: 30px; height: 30px;
      background: rgba(108,99,255,0.15);
      border: 1px solid rgba(108,99,255,0.22);
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      color: var(--primary-light);
    }
    .nav-brand-icon svg { width: 15px; height: 15px; stroke-width: 2; }
    .nav-right { display: flex; align-items: center; gap: 0.75rem; }
    .nav-user {
      display: flex; align-items: center; gap: 0.4rem;
      font-size: 0.8rem; color: var(--text-dim);
    }
    .nav-user svg { width: 13px; height: 13px; stroke-width: 2; color: var(--muted); }
    .btn-logout {
      display: flex; align-items: center; gap: 0.35rem;
      background: transparent; border: 1px solid var(--border);
      color: var(--muted); padding: 0.35rem 0.75rem;
      border-radius: 8px; cursor: pointer; font-size: 0.8rem;
      transition: all 0.18s; font-family: inherit;
    }
    .btn-logout svg { width: 13px; height: 13px; stroke-width: 2; }
    .btn-logout:hover { border-color: var(--danger-border); color: var(--danger); background: var(--danger-bg); }

    /* MAIN */
    main { max-width: 900px; margin: 0 auto; padding: 2.25rem 1.5rem; }
    .page-header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 2rem; gap: 1rem; flex-wrap: wrap; }
    .page-header-text h1 { font-size: 1.55rem; font-weight: 700; letter-spacing: -0.03em; }
    .page-header-text h1 span { color: var(--primary-light); }
    .page-header-text p { color: var(--muted); font-size: 0.84rem; margin-top: 0.3rem; }

    /* Buttons */
    .btn-primary {
      display: inline-flex; align-items: center; gap: 0.4rem;
      background: linear-gradient(135deg, #6c63ff, #8b5cf6);
      color: #fff; border: none;
      padding: 0.6rem 1.15rem; border-radius: var(--radius);
      font-size: 0.875rem; font-weight: 600;
      cursor: pointer; transition: all 0.18s;
      text-decoration: none; white-space: nowrap;
      box-shadow: 0 4px 12px rgba(108,99,255,0.3);
      font-family: inherit;
    }
    .btn-primary svg { width: 15px; height: 15px; stroke-width: 2.5; }
    .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 6px 18px rgba(108,99,255,0.4); }

    .btn-danger {
      display: inline-flex; align-items: center; gap: 0.35rem;
      background: transparent; border: 1px solid var(--danger-border);
      color: var(--danger); padding: 0.38rem 0.8rem;
      border-radius: 8px; font-size: 0.8rem;
      cursor: pointer; transition: all 0.18s; font-family: inherit;
    }
    .btn-danger svg { width: 13px; height: 13px; stroke-width: 2; }
    .btn-danger:hover { background: var(--danger-bg); border-color: var(--danger); }

    .btn-secondary {
      display: inline-flex; align-items: center; gap: 0.35rem;
      background: rgba(255,255,255,0.04); border: 1px solid var(--border);
      color: var(--text-dim); padding: 0.38rem 0.8rem;
      border-radius: 8px; font-size: 0.8rem;
      cursor: pointer; transition: all 0.18s; text-decoration: none; font-family: inherit;
    }
    .btn-secondary svg { width: 13px; height: 13px; stroke-width: 2; }
    .btn-secondary:hover { border-color: rgba(108,99,255,0.4); color: var(--primary-light); background: rgba(108,99,255,0.06); }

    /* Empty state */
    .empty {
      text-align: center; padding: 3.5rem 2rem;
      background: var(--surface);
      border: 1px dashed rgba(255,255,255,0.09);
      border-radius: 16px;
    }
    .empty-icon {
      width: 56px; height: 56px;
      background: rgba(108,99,255,0.1);
      border: 1px solid rgba(108,99,255,0.18);
      border-radius: 14px;
      display: inline-flex; align-items: center; justify-content: center;
      margin-bottom: 1.1rem;
      color: var(--primary-light);
    }
    .empty-icon svg { width: 24px; height: 24px; stroke-width: 1.75; }
    .empty h2 { font-size: 1.05rem; font-weight: 700; margin-bottom: 0.4rem; letter-spacing: -0.02em; }
    .empty p { color: var(--text-dim); font-size: 0.84rem; margin-bottom: 1.5rem; max-width: 320px; margin-left: auto; margin-right: auto; line-height: 1.6; }

    /* App cards */
    .apps-grid { display: grid; gap: 0.75rem; }
    .app-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 1.1rem 1.35rem;
      display: flex; align-items: center; gap: 1rem; justify-content: space-between;
      transition: all 0.18s;
    }
    .app-card:hover { border-color: rgba(108,99,255,0.3); background: rgba(255,255,255,0.05); }
    .app-card-left { display: flex; align-items: center; gap: 0.9rem; flex: 1; min-width: 0; }
    .app-icon {
      width: 38px; height: 38px;
      background: rgba(108,99,255,0.1);
      border: 1px solid rgba(108,99,255,0.18);
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; color: var(--primary-light);
    }
    .app-icon svg { width: 17px; height: 17px; stroke-width: 1.75; }
    .app-name { font-size: 0.9rem; font-weight: 600; margin-bottom: 0.25rem; letter-spacing: -0.01em; }
    .app-meta { display: flex; gap: 0.6rem; align-items: center; flex-wrap: wrap; }
    .client-id {
      font-family: 'SF Mono', 'Fira Code', monospace;
      font-size: 0.75rem;
      background: rgba(108,99,255,0.1);
      color: var(--primary-light);
      padding: 0.15rem 0.45rem; border-radius: 4px;
      border: 1px solid rgba(108,99,255,0.18);
    }
    .created { font-size: 0.76rem; color: var(--muted); display: flex; align-items: center; gap: 0.25rem; }
    .created svg { width: 11px; height: 11px; stroke-width: 2; }
    .app-actions { display: flex; gap: 0.45rem; align-items: center; flex-shrink: 0; }

    /* Loading */
    #loading { display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 0.85rem; padding: 4rem; color: var(--text-dim); font-size: 0.875rem; }
    .loading-ring { width: 28px; height: 28px; border: 2.5px solid rgba(108,99,255,0.2); border-top-color: var(--primary); border-radius: 50%; animation: spin 0.7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    #error-msg { display: flex; align-items: flex-start; gap: 0.5rem; background: var(--danger-bg); border: 1px solid var(--danger-border); color: var(--danger); padding: 0.75rem 1rem; border-radius: var(--radius); font-size: 0.84rem; margin-bottom: 1.25rem; }
    #error-msg svg { width: 15px; height: 15px; flex-shrink: 0; margin-top: 1px; stroke-width: 2.5; }

    /* Modal */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(6px); display: none; align-items: center; justify-content: center; z-index: 100; padding: 1rem; }
    .modal-overlay.active { display: flex; }
    .modal { background: #0c0d1a; border: 1px solid rgba(108,99,255,0.2); border-radius: 18px; padding: 2rem; max-width: 500px; width: 100%; box-shadow: 0 30px 80px rgba(0,0,0,0.6); }
    .modal-header { display: flex; align-items: center; gap: 0.65rem; margin-bottom: 0.4rem; }
    .modal-header-icon { width: 36px; height: 36px; background: rgba(52,211,153,0.1); border: 1px solid rgba(52,211,153,0.2); border-radius: 9px; display: flex; align-items: center; justify-content: center; color: #34d399; }
    .modal-header-icon svg { width: 17px; height: 17px; stroke-width: 2; }
    .modal h2 { font-size: 1rem; font-weight: 700; letter-spacing: -0.02em; }
    .modal .warning { display: flex; align-items: flex-start; gap: 0.5rem; background: rgba(251,191,36,0.08); border: 1px solid rgba(251,191,36,0.2); color: var(--warning); padding: 0.65rem 0.85rem; border-radius: 9px; font-size: 0.81rem; margin: 1rem 0; line-height: 1.5; }
    .modal .warning svg { width: 14px; height: 14px; flex-shrink: 0; margin-top: 1px; stroke-width: 2.5; }
    .field-label { font-size: 0.72rem; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 0.3rem; margin-top: 0.75rem; }
    .secret-field { background: rgba(255,255,255,0.03); border: 1px solid var(--border); border-radius: 8px; padding: 0.65rem 0.9rem; font-family: 'SF Mono', 'Fira Code', monospace; font-size: 0.8rem; word-break: break-all; position: relative; padding-right: 4.5rem; line-height: 1.5; }
    .copy-btn { position: absolute; right: 0.45rem; top: 50%; transform: translateY(-50%); display: flex; align-items: center; gap: 0.25rem; background: rgba(108,99,255,0.15); border: 1px solid rgba(108,99,255,0.22); color: var(--primary-light); padding: 0.22rem 0.55rem; border-radius: 5px; font-size: 0.72rem; font-weight: 600; cursor: pointer; transition: all 0.18s; }
    .copy-btn svg { width: 11px; height: 11px; stroke-width: 2.5; }
    .copy-btn:hover { background: rgba(108,99,255,0.25); }
    .btn-done { width: 100%; margin-top: 1.25rem; background: linear-gradient(135deg, #6c63ff, #8b5cf6); color: #fff; border: none; padding: 0.7rem; border-radius: var(--radius); font-size: 0.9rem; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 0.4rem; box-shadow: 0 4px 14px rgba(108,99,255,0.3); transition: all 0.18s; font-family: inherit; }
    .btn-done svg { width: 15px; height: 15px; stroke-width: 2.5; }
    .btn-done:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(108,99,255,0.4); }
  </style>
</head>
<body>
  <nav>
    <div class="nav-brand">
      <div class="nav-brand-icon"><i data-lucide="code-2"></i></div>
      Auth Provider
    </div>
    <div class="nav-right">
      <div class="nav-user">
        <i data-lucide="user"></i>
        <span id="nav-user"></span>
      </div>
      <button class="btn-logout" onclick="logout()">
        <i data-lucide="log-out"></i>
        Logout
      </button>
    </div>
  </nav>

  <main>
    <div class="page-header">
      <div class="page-header-text">
        <h1>Your <span>OAuth Apps</span></h1>
        <p>Registered applications using your auth provider</p>
      </div>
      <a href="/developer/new" class="btn-primary">
        <i data-lucide="plus"></i>
        Register New App
      </a>
    </div>

    <div id="error-msg" style="display:none"><i data-lucide="alert-circle"></i><span id="error-text"></span></div>
    <div id="loading"><div class="loading-ring"></div><span>Loading your apps…</span></div>
    <div id="apps-container" style="display:none"></div>
  </main>

  <!-- Secret Modal -->
  <div class="modal-overlay" id="secret-modal">
    <div class="modal">
      <div class="modal-header">
        <div class="modal-header-icon"><i data-lucide="check"></i></div>
        <h2>App Registered Successfully</h2>
      </div>
      <div class="warning">
        <i data-lucide="triangle-alert"></i>
        Save your Client Secret now — it will <strong>never be shown again</strong>. Store it securely.
      </div>
      <div class="field-label">Client ID</div>
      <div class="secret-field" id="modal-client-id">
        <button class="copy-btn" onclick="copyField('modal-client-id')"><i data-lucide="copy"></i> Copy</button>
      </div>
      <div class="field-label">Client Secret</div>
      <div class="secret-field" id="modal-client-secret">
        <button class="copy-btn" onclick="copyField('modal-client-secret')"><i data-lucide="copy"></i> Copy</button>
      </div>
      <button class="btn-done" onclick="closeSecretModal()">
        <i data-lucide="circle-check-big"></i>
        Done — I've saved my credentials
      </button>
    </div>
  </div>

  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script>
    lucide.createIcons();

    const API = '/api/developer';

    const pendingSecret = sessionStorage.getItem('new_client_credentials');
    if (pendingSecret) {
      const creds = JSON.parse(pendingSecret);
      sessionStorage.removeItem('new_client_credentials');
      document.getElementById('modal-client-id').childNodes[0].textContent     = creds.client_id;
      document.getElementById('modal-client-secret').childNodes[0].textContent = creds.client_secret;
      document.getElementById('secret-modal').classList.add('active');
    }

    function closeSecretModal() { document.getElementById('secret-modal').classList.remove('active'); }

    function copyField(id) {
      const el   = document.getElementById(id);
      const text = el.childNodes[0]?.textContent?.trim() || el.textContent.trim();
      navigator.clipboard.writeText(text).then(() => {
        const btn = el.querySelector('.copy-btn');
        btn.innerHTML = '<i data-lucide="check"></i> Copied';
        lucide.createIcons();
        setTimeout(() => { btn.innerHTML = '<i data-lucide="copy"></i> Copy'; lucide.createIcons(); }, 1500);
      });
    }

    async function loadApps() {
      try {
        const res = await fetch(API + '/clients', { credentials: 'include' });
        if (res.status === 401) { window.location.href = '/developer/login'; return; }
        const data = await res.json();

        const userRes = await fetch('/api/user/me', { credentials: 'include' });
        if (userRes.ok) { const u = await userRes.json(); document.getElementById('nav-user').textContent = u.user?.email || ''; }

        document.getElementById('loading').style.display = 'none';
        const container = document.getElementById('apps-container');
        container.style.display = 'block';

        if (!data.clients || data.clients.length === 0) {
          container.innerHTML = `
            <div class="empty">
              <div class="empty-icon"><i data-lucide="box"></i></div>
              <h2>No apps registered yet</h2>
              <p>Register your first OAuth 2.0 app to get a client ID and secret for your integration.</p>
              <a href="/developer/new" class="btn-primary"><i data-lucide="plus"></i> Register New App</a>
            </div>`;
          lucide.createIcons(); return;
        }

        container.innerHTML = `<div class="apps-grid">${data.clients.map(app => `
          <div class="app-card">
            <div class="app-card-left">
              <div class="app-icon"><i data-lucide="app-window"></i></div>
              <div>
                <div class="app-name">${escape(app.name)}</div>
                <div class="app-meta">
                  <span class="client-id">${app.client_id}</span>
                  <span class="created"><i data-lucide="calendar"></i> ${new Date(app.created_at).toLocaleDateString()}</span>
                </div>
              </div>
            </div>
            <div class="app-actions">
              <a href="/developer/clients/${app.id}" class="btn-secondary"><i data-lucide="settings-2"></i> Manage</a>
              <button class="btn-danger" onclick="deleteApp(${app.id}, '${escape(app.name)}')"><i data-lucide="trash-2"></i> Delete</button>
            </div>
          </div>`).join('')}</div>`;
        lucide.createIcons();
      } catch {
        document.getElementById('loading').style.display = 'none';
        showError('Failed to load apps. Please refresh.');
      }
    }

    async function deleteApp(id, name) {
      if (!confirm(`Delete "${name}"? This will immediately invalidate all issued tokens.`)) return;
      try {
        const res = await fetch(`${API}/clients/${id}`, { method: 'DELETE', credentials: 'include' });
        if (res.ok) { loadApps(); }
        else { const d = await res.json(); showError(d.error || 'Failed to delete app'); }
      } catch { showError('Failed to delete app'); }
    }

    async function logout() {
      await fetch('/api/auth/logout', { method: 'POST', credentials: 'include' });
      window.location.href = '/developer/login';
    }

    function showError(msg) {
      document.getElementById('error-text').textContent = msg;
      document.getElementById('error-msg').style.display = 'flex';
    }

    function escape(str) { return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

    loadApps();
  </script>
</body>
</html>
