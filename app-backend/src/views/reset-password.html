<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0f1117; --surface: #1a1d27; --border: #2a2d3e;
      --primary: #6c63ff; --primary-hover: #5a52e0;
      --text: #e2e8f0; --muted: #94a3b8; --danger: #ef4444; --success: #22c55e;
      --radius: 12px;
    }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg); color: var(--text);
      min-height: 100vh; display: flex; flex-direction: column;
      align-items: center; justify-content: center; padding: 1.5rem;
    }
    .card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 2.5rem 2rem;
      width: 100%; max-width: 400px;
    }
    .logo { text-align: center; margin-bottom: 1.5rem; }
    .logo-icon { font-size: 2rem; }
    .logo-title { font-size: 1.3rem; font-weight: 700; margin-top: 0.4rem; }
    .logo-sub { font-size: 0.85rem; color: var(--muted); margin-top: 0.25rem; }
    .form-group { margin-bottom: 1.1rem; }
    label { display: block; font-size: 0.82rem; font-weight: 600; margin-bottom: 0.35rem; }
    input[type="password"] {
      width: 100%; background: var(--bg); border: 1px solid var(--border);
      color: var(--text); padding: 0.65rem 0.9rem; border-radius: 8px;
      font-size: 0.9rem; outline: none; transition: border 0.2s;
    }
    input:focus { border-color: var(--primary); }
    .hint { font-size: 0.78rem; color: var(--muted); margin-top: 0.3rem; }
    .btn-submit {
      width: 100%; background: var(--primary); color: #fff; border: none;
      padding: 0.72rem; border-radius: 8px; font-size: 0.92rem; font-weight: 600;
      cursor: pointer; transition: background 0.2s; margin-top: 0.25rem;
    }
    .btn-submit:hover:not(:disabled) { background: var(--primary-hover); }
    .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; }
    .alert {
      padding: 0.7rem 1rem; border-radius: 7px; font-size: 0.84rem; margin-bottom: 1.1rem;
    }
    .alert-error   { background: rgba(239,68,68,0.1); border: 1px solid var(--danger); color: var(--danger); }
    .alert-success { background: rgba(34,197,94,0.1); border: 1px solid var(--success); color: var(--success); }
    .footer-links { text-align: center; margin-top: 1.25rem; font-size: 0.82rem; }
    .footer-links a { color: var(--muted); text-decoration: none; transition: color 0.2s; }
    .footer-links a:hover { color: var(--primary); }
    .invalid-state { text-align: center; padding: 2rem 0; }
    .invalid-state .icon { font-size: 3rem; margin-bottom: 1rem; }
    .invalid-state p { color: var(--muted); margin-top: 0.5rem; font-size: 0.9rem; }
    .spinner {
      display: inline-block; width: 14px; height: 14px;
      border: 2px solid rgba(255,255,255,0.3); border-top-color: #fff;
      border-radius: 50%; animation: spin 0.7s linear infinite;
      margin-right: 6px; vertical-align: middle;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="card">
    <div class="logo">
      <div class="logo-icon">🔐</div>
      <div class="logo-title">Reset Password</div>
      <div class="logo-sub">Enter your new password below</div>
    </div>

    <div id="invalid-view" class="invalid-state" style="display:none">
      <div class="icon">❌</div>
      <strong>Link Invalid or Expired</strong>
      <p>This password reset link has expired or already been used.</p>
      <br>
      <a href="/forgot-password" style="color:var(--primary)">Request a new reset link →</a>
    </div>

    <div id="form-view">
      <div class="alert alert-error" id="error-box" style="display:none"></div>
      <div class="alert alert-success" id="success-box" style="display:none"></div>

      <form id="reset-form" novalidate>
        <div class="form-group">
          <label for="newPassword">New Password</label>
          <input type="password" id="newPassword" name="newPassword" placeholder="Min 8 chars" required />
          <p class="hint">At least 8 characters with uppercase, lowercase, number &amp; special char.</p>
        </div>
        <div class="form-group">
          <label for="confirmPassword">Confirm Password</label>
          <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Repeat password" required />
        </div>
        <button type="submit" class="btn-submit" id="submit-btn">Reset Password</button>
      </form>
    </div>

    <div class="footer-links">
      <a href="/forgot-password">← Request new reset link</a>
    </div>
  </div>

  <script>
    // Extract token from URL path: /reset-password/:token
    const pathParts = window.location.pathname.split('/');
    const token     = pathParts[pathParts.length - 1];
    const params    = new URLSearchParams(window.location.search);
    const redirect  = params.get('redirect') || 'http://localhost:5173/login?reset=true';

    // Validate token on page load
    (async () => {
      try {
        const res = await fetch('/api/auth/validate-reset-token', {
          method:  'POST',
          headers: { 'Content-Type': 'application/json' },
          body:    JSON.stringify({ token }),
        });
        if (!res.ok) {
          document.getElementById('form-view').style.display    = 'none';
          document.getElementById('invalid-view').style.display = 'block';
        }
      } catch {
        document.getElementById('form-view').style.display    = 'none';
        document.getElementById('invalid-view').style.display = 'block';
      }
    })();

    document.getElementById('reset-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn           = document.getElementById('submit-btn');
      const errBox        = document.getElementById('error-box');
      const succBox       = document.getElementById('success-box');
      const newPassword   = document.getElementById('newPassword').value;
      const confirmPassword = document.getElementById('confirmPassword').value;

      errBox.style.display  = 'none';
      succBox.style.display = 'none';

      if (newPassword !== confirmPassword) {
        errBox.textContent   = 'Passwords do not match.';
        errBox.style.display = 'block';
        return;
      }
      if (newPassword.length < 8) {
        errBox.textContent   = 'Password must be at least 8 characters.';
        errBox.style.display = 'block';
        return;
      }

      btn.disabled  = true;
      btn.innerHTML = '<span class="spinner"></span>Resetting…';

      try {
        const res  = await fetch('/api/auth/reset-password', {
          method:  'POST',
          headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
          body:    JSON.stringify({ token, newPassword }),
        });
        const data = await res.json();

        if (res.ok) {
          succBox.textContent   = 'Password reset! Redirecting to login…';
          succBox.style.display = 'block';
          document.getElementById('reset-form').style.display = 'none';
          setTimeout(() => { window.location.href = redirect; }, 2000);
        } else {
          errBox.textContent   = data.error || 'Reset failed. Please try again.';
          errBox.style.display = 'block';
          btn.disabled  = false;
          btn.innerHTML = 'Reset Password';
        }
      } catch {
        errBox.textContent   = 'Network error. Please try again.';
        errBox.style.display = 'block';
        btn.disabled  = false;
        btn.innerHTML = 'Reset Password';
      }
    });
  </script>
</body>
</html>
