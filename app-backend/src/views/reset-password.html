<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #060818;
      --border: rgba(255,255,255,0.09);
      --border-focus: rgba(108,99,255,0.55);
      --primary: #6c63ff;
      --primary-light: #9d97ff;
      --text: #f1f5f9;
      --text-dim: #94a3b8;
      --muted: #475569;
      --danger: #f87171;
      --danger-bg: rgba(248,113,113,0.08);
      --danger-border: rgba(248,113,113,0.25);
      --success: #34d399;
      --success-bg: rgba(52,211,153,0.08);
      --success-border: rgba(52,211,153,0.25);
      --radius: 12px;
    }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      position: relative;
      overflow: hidden;
    }
    body::before {
      content: '';
      position: fixed;
      width: 500px; height: 500px;
      background: radial-gradient(circle at center, rgba(108,99,255,0.11) 0%, transparent 65%);
      top: -100px; right: -80px;
      pointer-events: none;
    }
    body::after {
      content: '';
      position: fixed;
      width: 400px; height: 400px;
      background: radial-gradient(circle at center, rgba(139,92,246,0.08) 0%, transparent 65%);
      bottom: -100px; left: -60px;
      pointer-events: none;
    }

    .card {
      background: rgba(255,255,255,0.03);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 400px;
      position: relative;
      box-shadow: 0 20px 60px rgba(0,0,0,0.4), 0 0 0 1px rgba(255,255,255,0.04) inset;
    }
    .card::before {
      content: '';
      position: absolute;
      top: 0; left: 15%; right: 15%;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(108,99,255,0.5), transparent);
    }

    .header { text-align: center; margin-bottom: 1.75rem; }
    .brand-icon {
      width: 48px; height: 48px;
      background: linear-gradient(135deg, rgba(108,99,255,0.18), rgba(139,92,246,0.12));
      border: 1px solid rgba(108,99,255,0.22);
      border-radius: 13px;
      display: inline-flex; align-items: center; justify-content: center;
      margin-bottom: 0.9rem;
      color: var(--primary-light);
    }
    .brand-icon svg { width: 22px; height: 22px; stroke-width: 1.75; }
    .header h1 { font-size: 1.3rem; font-weight: 700; letter-spacing: -0.025em; }
    .header p { font-size: 0.84rem; color: var(--text-dim); margin-top: 0.3rem; }

    .alert {
      display: flex; align-items: flex-start; gap: 0.5rem;
      padding: 0.65rem 0.85rem; border-radius: var(--radius);
      font-size: 0.82rem; margin-bottom: 1.1rem;
    }
    .alert svg { width: 14px; height: 14px; flex-shrink: 0; margin-top: 1px; stroke-width: 2.5; }
    .alert-error   { background: var(--danger-bg);  border: 1px solid var(--danger-border);  color: var(--danger);  }
    .alert-success { background: var(--success-bg); border: 1px solid var(--success-border); color: var(--success); }

    .field { margin-bottom: 1rem; }
    .field label { display: block; font-size: 0.78rem; font-weight: 600; color: var(--text-dim); margin-bottom: 0.38rem; }
    .hint { font-size: 0.74rem; color: var(--muted); margin-top: 0.25rem; line-height: 1.5; }
    .input-wrap { position: relative; display: flex; align-items: center; }
    .input-icon { position: absolute; left: 0.72rem; color: var(--muted); display: flex; align-items: center; pointer-events: none; }
    .input-icon svg { width: 15px; height: 15px; stroke-width: 2; }
    .input-wrap input {
      width: 100%;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.65rem 2.5rem;
      border-radius: var(--radius);
      font-size: 0.875rem;
      outline: none;
      transition: all 0.18s ease;
      font-family: inherit;
    }
    .input-wrap input::placeholder { color: var(--muted); }
    .input-wrap input:focus { border-color: var(--border-focus); background: rgba(108,99,255,0.04); box-shadow: 0 0 0 3px rgba(108,99,255,0.1); }
    .toggle-pw {
      position: absolute; right: 0.7rem;
      background: none; border: none; cursor: pointer;
      color: var(--muted); display: flex; align-items: center; padding: 0; transition: color 0.18s;
    }
    .toggle-pw:hover { color: var(--text-dim); }
    .toggle-pw svg { width: 14px; height: 14px; stroke-width: 2; }

    .btn-submit {
      width: 100%;
      background: linear-gradient(135deg, #6c63ff, #8b5cf6);
      color: #fff; border: none;
      padding: 0.7rem; border-radius: var(--radius);
      font-size: 0.9rem; font-weight: 600;
      cursor: pointer; transition: all 0.18s ease;
      margin-top: 0.25rem;
      display: flex; align-items: center; justify-content: center; gap: 0.45rem;
      box-shadow: 0 4px 14px rgba(108,99,255,0.35);
      font-family: inherit;
    }
    .btn-submit svg { width: 16px; height: 16px; stroke-width: 2.5; }
    .btn-submit:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(108,99,255,0.45); }
    .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; }

    /* Invalid state */
    .invalid-state { text-align: center; padding: 1.5rem 0; }
    .invalid-badge {
      width: 52px; height: 52px;
      background: rgba(248,113,113,0.1);
      border: 1px solid rgba(248,113,113,0.22);
      border-radius: 13px;
      display: inline-flex; align-items: center; justify-content: center;
      margin-bottom: 1rem;
      color: var(--danger);
    }
    .invalid-badge svg { width: 24px; height: 24px; stroke-width: 1.75; }
    .invalid-state h2 { font-size: 1.05rem; font-weight: 700; margin-bottom: 0.5rem; }
    .invalid-state p  { color: var(--text-dim); font-size: 0.84rem; margin-bottom: 1.25rem; line-height: 1.6; }
    .btn-new-link {
      display: inline-flex; align-items: center; gap: 0.4rem;
      background: linear-gradient(135deg, #6c63ff, #8b5cf6);
      color: #fff; padding: 0.6rem 1.4rem;
      border-radius: var(--radius); text-decoration: none;
      font-size: 0.875rem; font-weight: 600;
      box-shadow: 0 4px 14px rgba(108,99,255,0.3);
      transition: all 0.18s;
    }
    .btn-new-link svg { width: 15px; height: 15px; stroke-width: 2.5; }
    .btn-new-link:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(108,99,255,0.4); }

    .footer { text-align: center; margin-top: 1.25rem; font-size: 0.8rem; }
    .back-link { display: inline-flex; align-items: center; gap: 0.35rem; color: var(--text-dim); text-decoration: none; transition: color 0.18s; font-weight: 500; }
    .back-link svg { width: 13px; height: 13px; stroke-width: 2.5; }
    .back-link:hover { color: var(--primary-light); }

    .spinner { width: 14px; height: 14px; border: 2px solid rgba(255,255,255,0.3); border-top-color: #fff; border-radius: 50%; animation: spin 0.6s linear infinite; flex-shrink: 0; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="card">
    <div class="header">
      <div class="brand-icon"><i data-lucide="lock-keyhole"></i></div>
      <h1>Reset password</h1>
      <p>Enter your new password below</p>
    </div>

    <div id="invalid-view" style="display:none">
      <div class="invalid-state">
        <div class="invalid-badge"><i data-lucide="link-2-off"></i></div>
        <h2>Link Invalid or Expired</h2>
        <p>This password reset link has expired or already been used. Request a new one to continue.</p>
        <a href="/forgot-password" class="btn-new-link">
          <i data-lucide="refresh-cw"></i>
          Request new link
        </a>
      </div>
    </div>

    <div id="form-view">
      <div class="alert alert-error"   id="error-box"   style="display:none"><i data-lucide="alert-circle"></i><span id="error-text"></span></div>
      <div class="alert alert-success" id="success-box" style="display:none"><i data-lucide="check-circle-2"></i><span id="success-text"></span></div>

      <form id="reset-form" novalidate>
        <div class="field">
          <label for="newPassword">New password</label>
          <div class="input-wrap">
            <span class="input-icon"><i data-lucide="lock"></i></span>
            <input type="password" id="newPassword" name="newPassword" placeholder="Min 8 characters" required />
            <button type="button" class="toggle-pw" id="toggle-pw1" aria-label="Toggle">
              <i data-lucide="eye" id="eye1"></i>
            </button>
          </div>
          <p class="hint">At least 8 chars with uppercase, lowercase, number &amp; special char.</p>
        </div>
        <div class="field">
          <label for="confirmPassword">Confirm password</label>
          <div class="input-wrap">
            <span class="input-icon"><i data-lucide="lock"></i></span>
            <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Repeat your password" required />
            <button type="button" class="toggle-pw" id="toggle-pw2" aria-label="Toggle">
              <i data-lucide="eye" id="eye2"></i>
            </button>
          </div>
        </div>
        <button type="submit" class="btn-submit" id="submit-btn">
          <i data-lucide="shield-check"></i>
          Reset Password
        </button>
      </form>
    </div>

    <div class="footer">
      <a href="/forgot-password" class="back-link">
        <i data-lucide="arrow-left"></i>
        Request new reset link
      </a>
    </div>
  </div>

  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script>
    lucide.createIcons();

    // Password toggles
    function mkToggle(btnId, inputId, iconId) {
      let vis = false;
      document.getElementById(btnId).addEventListener('click', () => {
        vis = !vis;
        document.getElementById(inputId).type = vis ? 'text' : 'password';
        document.getElementById(iconId).setAttribute('data-lucide', vis ? 'eye-off' : 'eye');
        lucide.createIcons();
      });
    }
    mkToggle('toggle-pw1', 'newPassword',     'eye1');
    mkToggle('toggle-pw2', 'confirmPassword', 'eye2');

    const pathParts = window.location.pathname.split('/');
    const token     = pathParts[pathParts.length - 1];
    const params    = new URLSearchParams(window.location.search);
    const redirect  = params.get('redirect') || 'http://localhost:5173/login?reset=true';

    (async () => {
      try {
        const res = await fetch('/api/auth/validate-reset-token', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ token }) });
        if (!res.ok) { document.getElementById('form-view').style.display = 'none'; document.getElementById('invalid-view').style.display = 'block'; lucide.createIcons(); }
      } catch {
        document.getElementById('form-view').style.display    = 'none';
        document.getElementById('invalid-view').style.display = 'block';
        lucide.createIcons();
      }
    })();

    document.getElementById('reset-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn             = document.getElementById('submit-btn');
      const errBox          = document.getElementById('error-box');
      const succBox         = document.getElementById('success-box');
      const newPassword     = document.getElementById('newPassword').value;
      const confirmPassword = document.getElementById('confirmPassword').value;

      errBox.style.display = succBox.style.display = 'none';

      if (newPassword !== confirmPassword) {
        document.getElementById('error-text').textContent = 'Passwords do not match.';
        errBox.style.display = 'flex'; return;
      }
      if (newPassword.length < 8) {
        document.getElementById('error-text').textContent = 'Password must be at least 8 characters.';
        errBox.style.display = 'flex'; return;
      }

      btn.disabled  = true;
      btn.innerHTML = '<div class="spinner"></div> Resetting…';

      try {
        const res  = await fetch('/api/auth/reset-password', { method: 'POST', headers: { 'Content-Type': 'application/json', Accept: 'application/json' }, body: JSON.stringify({ token, newPassword }) });
        const data = await res.json();
        if (res.ok) {
          document.getElementById('success-text').textContent = 'Password reset! Redirecting to login…';
          succBox.style.display = 'flex';
          document.getElementById('reset-form').style.display = 'none';
          setTimeout(() => { window.location.href = redirect; }, 2000);
        } else {
          document.getElementById('error-text').textContent = data.error || 'Reset failed. Please try again.';
          errBox.style.display = 'flex';
          btn.disabled  = false;
          btn.innerHTML = '<i data-lucide="shield-check"></i> Reset Password';
          lucide.createIcons();
        }
      } catch {
        document.getElementById('error-text').textContent = 'Network error. Please try again.';
        errBox.style.display = 'flex';
        btn.disabled  = false;
        btn.innerHTML = '<i data-lucide="shield-check"></i> Reset Password';
        lucide.createIcons();
      }
    });
  </script>
</body>
</html>
