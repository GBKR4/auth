<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Account</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #060818;
      --border: rgba(255,255,255,0.09);
      --border-focus: rgba(108,99,255,0.55);
      --primary: #6c63ff;
      --primary-light: #9d97ff;
      --text: #f1f5f9;
      --text-dim: #94a3b8;
      --muted: #475569;
      --danger: #f87171;
      --danger-bg: rgba(248,113,113,0.08);
      --danger-border: rgba(248,113,113,0.25);
      --success: #34d399;
      --success-bg: rgba(52,211,153,0.08);
      --success-border: rgba(52,211,153,0.25);
      --radius: 12px;
    }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      position: relative;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      width: 550px; height: 550px;
      background: radial-gradient(circle at center, rgba(108,99,255,0.1) 0%, transparent 65%);
      top: -150px; right: -100px;
      pointer-events: none;
    }
    body::after {
      content: '';
      position: fixed;
      width: 400px; height: 400px;
      background: radial-gradient(circle at center, rgba(6,182,212,0.07) 0%, transparent 65%);
      bottom: -100px; left: -80px;
      pointer-events: none;
    }

    .card {
      background: rgba(255,255,255,0.03);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 2.25rem 2rem;
      width: 100%;
      max-width: 448px;
      position: relative;
      box-shadow: 0 20px 60px rgba(0,0,0,0.4), 0 0 0 1px rgba(255,255,255,0.04) inset;
    }
    .card::before {
      content: '';
      position: absolute;
      top: 0; left: 15%; right: 15%;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(108,99,255,0.5), transparent);
    }

    .header { text-align: center; margin-bottom: 1.5rem; }
    .brand-icon {
      width: 46px; height: 46px;
      background: linear-gradient(135deg, rgba(108,99,255,0.18), rgba(139,92,246,0.12));
      border: 1px solid rgba(108,99,255,0.22);
      border-radius: 12px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 0.85rem;
      color: var(--primary-light);
    }
    .brand-icon svg { width: 21px; height: 21px; stroke-width: 1.75; }
    .header h1 { font-size: 1.3rem; font-weight: 700; letter-spacing: -0.025em; }
    .header p { font-size: 0.84rem; color: var(--text-dim); margin-top: 0.28rem; }
    .header p span { color: var(--primary-light); font-weight: 600; }

    /* Alerts */
    .alert {
      display: flex;
      align-items: flex-start;
      gap: 0.5rem;
      padding: 0.65rem 0.85rem;
      border-radius: var(--radius);
      font-size: 0.82rem;
      margin-bottom: 1rem;
    }
    .alert svg { width: 14px; height: 14px; flex-shrink: 0; margin-top: 1px; stroke-width: 2.5; }
    .alert-error   { background: var(--danger-bg);  border: 1px solid var(--danger-border);  color: var(--danger);  }
    .alert-success { background: var(--success-bg); border: 1px solid var(--success-border); color: var(--success); }

    /* Form */
    .row { display: flex; gap: 0.65rem; }
    .row .field { flex: 1; }
    .field { margin-bottom: 0.9rem; }
    .field label {
      display: block;
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--text-dim);
      margin-bottom: 0.36rem;
      letter-spacing: 0.01em;
    }
    .input-wrap { position: relative; display: flex; align-items: center; }
    .input-icon {
      position: absolute;
      left: 0.72rem;
      color: var(--muted);
      display: flex;
      align-items: center;
      pointer-events: none;
      transition: color 0.18s;
    }
    .input-icon svg { width: 14px; height: 14px; stroke-width: 2; }
    .input-wrap input {
      width: 100%;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.62rem 0.85rem 0.62rem 2.25rem;
      border-radius: var(--radius);
      font-size: 0.875rem;
      outline: none;
      transition: all 0.18s ease;
      font-family: inherit;
    }
    .input-wrap input::placeholder { color: var(--muted); }
    .input-wrap input:focus {
      border-color: var(--border-focus);
      background: rgba(108,99,255,0.04);
      box-shadow: 0 0 0 3px rgba(108,99,255,0.1);
    }
    .input-wrap input:focus ~ .input-icon,
    .input-wrap:has(input:focus) .input-icon { color: var(--primary-light); }
    .toggle-pw {
      position: absolute; right: 0.7rem;
      background: none; border: none; cursor: pointer;
      color: var(--muted); display: flex; align-items: center; padding: 0;
      transition: color 0.18s;
    }
    .toggle-pw:hover { color: var(--text-dim); }
    .toggle-pw svg { width: 14px; height: 14px; stroke-width: 2; }

    .hint { font-size: 0.73rem; color: var(--muted); margin-top: 0.25rem; line-height: 1.5; }
    .hint code { background: rgba(108,99,255,0.12); color: var(--primary-light); padding: 0.08rem 0.3rem; border-radius: 4px; }

    .btn-submit {
      width: 100%;
      background: linear-gradient(135deg, #6c63ff, #8b5cf6);
      color: #fff;
      border: none;
      padding: 0.7rem;
      border-radius: var(--radius);
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.18s ease;
      margin-top: 0.35rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.45rem;
      box-shadow: 0 4px 14px rgba(108,99,255,0.35);
      font-family: inherit;
    }
    .btn-submit svg { width: 16px; height: 16px; stroke-width: 2.5; }
    .btn-submit:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(108,99,255,0.45); }
    .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; }

    .footer { text-align: center; font-size: 0.8rem; color: var(--text-dim); margin-top: 1.1rem; }
    .footer a { color: var(--primary-light); text-decoration: none; font-weight: 500; }
    .footer a:hover { text-decoration: underline; }

    .spinner { width: 14px; height: 14px; border: 2px solid rgba(255,255,255,0.3); border-top-color: #fff; border-radius: 50%; animation: spin 0.6s linear infinite; flex-shrink: 0; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="card">
    <div class="header">
      <div class="brand-icon"><i data-lucide="user-plus"></i></div>
      <h1>Create your account</h1>
      <p>to continue to <span id="app-name">the app</span></p>
    </div>

    <div class="alert alert-error"   id="error-box"   style="display:none"><i data-lucide="alert-circle"></i><span id="error-text"></span></div>
    <div class="alert alert-success" id="success-box" style="display:none"><i data-lucide="check-circle-2"></i><span id="success-text"></span></div>

    <form id="register-form" novalidate>
      <div class="row">
        <div class="field">
          <label for="first_name">First name *</label>
          <div class="input-wrap">
            <span class="input-icon"><i data-lucide="user"></i></span>
            <input type="text" id="first_name" placeholder="John" required />
          </div>
        </div>
        <div class="field">
          <label for="last_name">Last name</label>
          <div class="input-wrap">
            <span class="input-icon"><i data-lucide="user"></i></span>
            <input type="text" id="last_name" placeholder="Doe" />
          </div>
        </div>
      </div>

      <div class="field">
        <label for="username">Username *</label>
        <div class="input-wrap">
          <span class="input-icon"><i data-lucide="at-sign"></i></span>
          <input type="text" id="username" placeholder="johndoe" required />
        </div>
        <div class="hint">3–30 alphanumeric characters</div>
      </div>

      <div class="field">
        <label for="email">Email address *</label>
        <div class="input-wrap">
          <span class="input-icon"><i data-lucide="mail"></i></span>
          <input type="email" id="email" placeholder="you@example.com" required />
        </div>
      </div>

      <div class="field">
        <label for="password">Password *</label>
        <div class="input-wrap">
          <span class="input-icon"><i data-lucide="lock"></i></span>
          <input type="password" id="password" placeholder="Min 8 characters" required />
          <button type="button" class="toggle-pw" id="toggle-pw" aria-label="Toggle password">
            <i data-lucide="eye" id="eye-icon"></i>
          </button>
        </div>
        <div class="hint">Uppercase · lowercase · number · special char — e.g. <code>MyPass@123</code></div>
      </div>

      <button type="submit" class="btn-submit" id="submit-btn">
        <i data-lucide="user-check"></i>
        Create Account
      </button>
    </form>

    <div class="footer">
      Already have an account? <a href="#" id="signin-link">Sign in →</a>
    </div>
  </div>

  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script>
    lucide.createIcons();

    // Password toggle
    let pwVisible = false;
    document.getElementById('toggle-pw').addEventListener('click', () => {
      pwVisible = !pwVisible;
      document.getElementById('password').type = pwVisible ? 'text' : 'password';
      document.getElementById('eye-icon').setAttribute('data-lucide', pwVisible ? 'eye-off' : 'eye');
      lucide.createIcons();
    });

    const params  = new URLSearchParams(window.location.search);
    if (!params.get('response_type')) params.set('response_type', 'code');
    const appName = params.get('app_name') || 'the app';
    document.getElementById('app-name').textContent = appName;
    document.getElementById('signin-link').href = `/oauth/authorize?${params.toString()}`;

    document.getElementById('register-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const first_name = document.getElementById('first_name').value.trim();
      const last_name  = document.getElementById('last_name').value.trim();
      const username   = document.getElementById('username').value.trim();
      const email      = document.getElementById('email').value.trim();
      const password   = document.getElementById('password').value;
      const btn        = document.getElementById('submit-btn');

      if (!first_name || !username || !email || !password) { showError('Please fill in all required fields.'); return; }

      btn.disabled  = true;
      btn.innerHTML = '<div class="spinner"></div> Creating account…';
      hideAll();

      try {
        const res  = await fetch('/api/auth/register', { method: 'POST', headers: { 'Content-Type': 'application/json' }, credentials: 'include', body: JSON.stringify({ first_name, last_name, username, email, password }) });
        const data = await res.json();
        if (!res.ok) {
          let msg = data.error || data.message;
          if (!msg && data.errors?.length) msg = data.errors.map(e => e.msg).join(' · ');
          showError(msg || 'Registration failed. Check your inputs.');
          btn.disabled  = false;
          btn.innerHTML = '<i data-lucide="user-check"></i> Create Account';
          lucide.createIcons();
          return;
        }
        showSuccess('Account created! Check your email to verify it, then sign in.');
        document.getElementById('register-form').style.display = 'none';
        setTimeout(() => { window.location.href = `/oauth/authorize?${params.toString()}`; }, 4000);
      } catch {
        showError('Network error. Is the server running?');
        btn.disabled  = false;
        btn.innerHTML = '<i data-lucide="user-check"></i> Create Account';
        lucide.createIcons();
      }
    });

    function showError(msg)   { const el = document.getElementById('error-box');   document.getElementById('error-text').textContent = msg;   el.style.display = 'flex'; }
    function showSuccess(msg) { const el = document.getElementById('success-box'); document.getElementById('success-text').textContent = msg; el.style.display = 'flex'; }
    function hideAll()        { document.getElementById('error-box').style.display = 'none'; document.getElementById('success-box').style.display = 'none'; }
  </script>
</body>
</html>
