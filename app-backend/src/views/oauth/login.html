<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0f1117; --surface: #1a1d27; --border: #2a2d3e;
      --primary: #6c63ff; --primary-hover: #5a52e0;
      --text: #e2e8f0; --muted: #94a3b8; --danger: #ef4444;
      --radius: 12px;
    }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 400px;
    }

    .logo { text-align: center; margin-bottom: 1.5rem; }
    .logo-icon { font-size: 2rem; }
    .logo-title { font-size: 1.3rem; font-weight: 700; margin-top: 0.4rem; }
    .logo-sub { font-size: 0.85rem; color: var(--muted); margin-top: 0.25rem; }
    .app-name { color: var(--primary); font-weight: 600; }

    .divider { display: flex; align-items: center; gap: 0.75rem; margin: 1.25rem 0; }
    .divider-line { flex: 1; height: 1px; background: var(--border); }
    .divider-text { font-size: 0.78rem; color: var(--muted); }

    /* Google button */
    .btn-google {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      background: #fff;
      color: #333;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.7rem 1rem;
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s;
      text-decoration: none;
    }
    .btn-google:hover { background: #f5f5f5; }
    .google-icon { width: 18px; height: 18px; }

    /* Form */
    .form-group { margin-bottom: 1.1rem; }
    label { display: block; font-size: 0.82rem; font-weight: 600; margin-bottom: 0.35rem; color: var(--text); }
    input[type="email"], input[type="password"] {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.65rem 0.9rem;
      border-radius: 8px;
      font-size: 0.9rem;
      outline: none;
      transition: border 0.2s;
    }
    input:focus { border-color: var(--primary); }

    .btn-submit {
      width: 100%;
      background: var(--primary);
      color: #fff;
      border: none;
      padding: 0.72rem;
      border-radius: 8px;
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      margin-top: 0.25rem;
    }
    .btn-submit:hover:not(:disabled) { background: var(--primary-hover); }
    .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; }

    .error-box {
      background: rgba(239,68,68,0.1);
      border: 1px solid var(--danger);
      color: var(--danger);
      padding: 0.7rem 1rem;
      border-radius: 7px;
      font-size: 0.84rem;
      margin-bottom: 1.1rem;
    }

    .footer-links {
      display: flex;
      justify-content: space-between;
      margin-top: 1.25rem;
      font-size: 0.82rem;
    }
    .footer-links a { color: var(--muted); text-decoration: none; transition: color 0.2s; }
    .footer-links a:hover { color: var(--primary); }

    .spinner {
      display: inline-block;
      width: 14px; height: 14px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin-right: 6px;
      vertical-align: middle;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="card">
    <div class="logo">
      <div class="logo-icon">⚡</div>
      <div class="logo-title">Sign in</div>
      <div class="logo-sub">to continue to <span class="app-name" id="app-name-display">your app</span></div>
    </div>

    <!-- Error message (shown on failed login) -->
    <div class="error-box" id="error-box" style="display:none"></div>

    <!-- Google OAuth button -->
    <a href="#" class="btn-google" id="google-btn">
      <svg class="google-icon" viewBox="0 0 24 24">
        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/>
        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
      </svg>
      Continue with Google
    </a>

    <div class="divider">
      <div class="divider-line"></div>
      <div class="divider-text">or</div>
      <div class="divider-line"></div>
    </div>

    <!-- Email/password form -->
    <form id="login-form" method="POST" action="/oauth/login" novalidate>
      <!-- Hidden OAuth params preserved through login -->
      <input type="hidden" name="client_id" id="h-client_id" />
      <input type="hidden" name="redirect_uri" id="h-redirect_uri" />
      <input type="hidden" name="state" id="h-state" />
      <input type="hidden" name="code_challenge" id="h-code_challenge" />
      <input type="hidden" name="code_challenge_method" id="h-code_challenge_method" />

      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email" required />
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password" required />
      </div>

      <button type="submit" class="btn-submit" id="submit-btn">Sign in</button>
    </form>

    <div class="footer-links">
      <a href="#" id="forgot-link">Forgot password?</a>
      <a href="#" id="register-link">Create account</a>
    </div>
  </div>

  <script>
    // Read OAuth params from current URL query string
    const params = new URLSearchParams(window.location.search);
    const clientId    = params.get('client_id') || '';
    const redirectUri = params.get('redirect_uri') || '';
    const state       = params.get('state') || '';
    const challenge   = params.get('code_challenge') || '';
    const method      = params.get('code_challenge_method') || 'S256';
    const error       = params.get('error') || '';
    const appName     = params.get('app_name') || 'your app';

    // Populate hidden fields
    document.getElementById('h-client_id').value           = clientId;
    document.getElementById('h-redirect_uri').value        = redirectUri;
    document.getElementById('h-state').value               = state;
    document.getElementById('h-code_challenge').value      = challenge;
    document.getElementById('h-code_challenge_method').value = method;

    // Show app name
    document.getElementById('app-name-display').textContent = appName;

    // Show error if any
    if (error) {
      const box = document.getElementById('error-box');
      box.textContent = decodeURIComponent(error);
      box.style.display = 'block';
    }

    // Build Google OAuth URL (preserves OAuth flow params in state)
    const googleParams = new URLSearchParams({
      client_id:             clientId,
      redirect_uri:          redirectUri,
      state:                 state,
      code_challenge:        challenge,
      code_challenge_method: method,
    });
    document.getElementById('google-btn').href = `/api/auth/google?oauthState=${encodeURIComponent(googleParams.toString())}`;

    // Forgot password / register links (preserve OAuth return params)
    const returnParams = new URLSearchParams({
      response_type: 'code',
      client_id: clientId, redirect_uri: redirectUri, state,
      code_challenge: challenge, code_challenge_method: method,
      app_name: appName,
    }).toString();

    document.getElementById('forgot-link').href   = `/forgot-password`;
    document.getElementById('register-link').href = `/oauth/register?${returnParams}`;

    // ── Submit via fetch to bypass CSP form-action restriction ───────────────
    // Native HTML form POSTs are governed by form-action CSP; fetch() calls use
    // connect-src instead. Since connect-src 'self' is already allowed, we POST
    // via fetch with Accept: application/json so the server returns a redirect URL
    // as JSON instead of a 302, then navigate there ourselves.
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();

      const btn   = document.getElementById('submit-btn');
      const errBox = document.getElementById('error-box');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span>Signing in…';
      errBox.style.display = 'none';

      const formData = new FormData(e.target);
      const body     = new URLSearchParams(formData).toString();

      try {
        const res = await fetch('/oauth/login', {
          method:  'POST',
          headers: {
            'Content-Type': 'application/x-www-form-urlencoded',
            'Accept':       'application/json',
          },
          body,
        });

        const data = await res.json();

        if (!res.ok || data.error) {
          // Server returned an error (400/401) — show inline
          errBox.textContent    = data.error || 'Login failed. Please try again.';
          errBox.style.display  = 'block';
          btn.disabled          = false;
          btn.innerHTML         = 'Sign in';
          return;
        }

        // data.redirect is either the callback URL (success) or /oauth/authorize?error=...
        if (data.redirect) {
          window.location.href = data.redirect;
        }
      } catch (err) {
        errBox.textContent   = 'Network error. Please try again.';
        errBox.style.display = 'block';
        btn.disabled         = false;
        btn.innerHTML        = 'Sign in';
      }
    });

  </script>
</body>
</html>
